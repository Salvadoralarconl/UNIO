upstream unio_api {
    zone unio_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server api:8443 resolve;
}
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}
server {
    listen 8080;
    server_name unio.getunio.dev;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    server_tokens off;
    # Do not log URL query strings, setup links or request bodies.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    # Cloudflare supplies the original scheme. API still uses actual HTTPS;
    # no application trust in forwarded headers is enabled.
    if ($http_x_forwarded_proto = "http") {
        return 308 https://unio.getunio.dev$request_uri;
    }
    location = /healthz { return 200 'ok'; }
    location = /api { return 404; }
    location /api/ {
        proxy_pass https://unio_api;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /run/tls/origin.crt;
        proxy_ssl_server_name on;
        proxy_ssl_name api;
        proxy_set_header Host unio.getunio.dev;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }
    location /internal/ { return 404; }
    location ~ /\. { return 404; }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }
}
